<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    direction:rtl;
    background:#fff;
    color:#382b22;
    font-family:"zain","Cairo",sans-serif;
    overflow-x:hidden;
}

img{
    display:block;
    max-width:100%;
}

a{
    text-decoration:none;
    color:inherit;
}

button{
    font-family:"zain","Cairo",sans-serif;
}

@font-face{
    font-family:"zain";
    src:url("FF Yaseer.otf");
}




/* =========================================================
   HERO
========================================================= */

.hero{
    width:1560px;
    max-width:calc(100% - 70px);

    height:390px;

    margin:30px auto 0;

    border-radius:18px;

    overflow:hidden;

    position:relative;

    background-image:
        linear-gradient(
            90deg,
            rgba(10,10,10,.08),
            rgba(10,10,10,.28),
            rgba(10,10,10,.72)
        ),
        url("https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=1800&q=90");

    background-position:center;
    background-size:cover;

    box-shadow:
        0 15px 40px rgba(35,27,20,.10);
}

.hero::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            transparent 35%,
            rgba(0,0,0,.08)
        );

    pointer-events:none;
}

.hero-content{
    position:absolute;

    right:55px;
    top:50%;

    transform:translateY(-50%);

    color:#fff;

    text-align:right;

    z-index:2;
}

.hero-content h1{
    font-size:48px;
    line-height:1.25;

    font-weight:900;

    margin-bottom:24px;

    text-shadow:
        0 4px 15px rgba(0,0,0,.25);
}

.hero-button{
    min-height:50px;

    padding:0 24px;

    border:1px solid #e5a01b;

    border-radius:10px;

    color:#fff;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    gap:15px;

    font-size:16px;
    font-weight:700;

    background:rgba(0,0,0,.18);

    backdrop-filter:blur(6px);

    transition:.3s;
}

.hero-button span{
    font-size:25px;

    line-height:1;
}

.hero-button:hover{
    background:#e5a01b;

    transform:translateX(-4px);
}


/* =========================================================
   CATEGORIES SECTION
========================================================= */

.categories{
    width:100%;

    margin-top:45px;
}

.categories-title{
    width:1450px;
    max-width:calc(100% - 70px);

    margin:0 auto 34px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:20px;
}

.categories-title::before,
.categories-title::after{
    content:"";

    width:95px;
    height:2px;

    background:#dfd2c2;
}

.categories-title h2{
    color:#583a25;

    font-size:29px;

    font-weight:900;

    white-space:nowrap;
}


/* =========================================================
   CATEGORY ROW
========================================================= */

.categories-row{
    width:1450px;
    max-width:calc(100% - 70px);

    margin:auto;

    display:flex;

    justify-content:center;
    align-items:flex-start;

    gap:75px;

    flex-wrap:wrap;
}


/* =========================================================
   CATEGORY
========================================================= */

.category{
    width:210px;

    border:none;
    background:none;

    cursor:pointer;

    display:flex;
    flex-direction:column;
    align-items:center;

    position:relative;

    transition:.35s;
}

.category-badge{
    width:170px;
    height:235px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    border:3px solid #d88f0c;

    border-radius:85px;

    background:
        radial-gradient(
            circle at 50% 35%,
            #fffdf6 0%,
            #fff4d9 50%,
            #f1d18c 100%
        );

    box-shadow:
        0 12px 30px rgba(174,116,18,.13),
        inset 0 0 0 5px rgba(255,255,255,.45);

    transition:.35s;

    overflow:hidden;
}

.category-badge::before{
    content:"";

    position:absolute;

    inset:10px;

    border:2px solid #d89b29;

    border-radius:75px;

    pointer-events:none;
}

.category-badge::after{
    content:"";

    position:absolute;

    inset:22px;

    border:1px solid rgba(194,129,18,.65);

    border-radius:63px;

    pointer-events:none;
}

.category-icon{
    width:125px;
    height:165px;

    position:relative;
    z-index:3;

    display:flex;
    align-items:center;
    justify-content:center;

    border:2px solid #c98918;

    border-radius:62px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.75),
            rgba(255,242,210,.65)
        );

    overflow:hidden;

    box-shadow:
        inset 0 0 20px rgba(198,132,17,.08);
}

.category-icon img{
    width:100%;
    height:100%;

    object-fit:contain;

    padding:7px;

    transition:.4s;
}

.category-name{
    margin-top:17px;

    color:#382b22;

    font-size:17px;
    font-weight:900;

    line-height:1.7;

    text-align:center;

    min-height:52px;

    transition:.25s;
}

.category:hover .category-badge{
    transform:translateY(-8px) scale(1.035);

    box-shadow:
        0 20px 38px rgba(174,116,18,.23),
        inset 0 0 0 5px rgba(255,255,255,.55);
}

.category:hover .category-icon img{
    transform:scale(1.05);
}

.category:hover .category-name{
    color:#c68112;
}

.category.active .category-badge{
    transform:translateY(-8px);

    box-shadow:
        0 20px 40px rgba(174,116,18,.25),
        0 0 0 5px rgba(226,164,38,.07);
}

.category.active .category-name{
    color:#bd7810;
}

.category.active::after{
    content:"";

    position:absolute;

    bottom:-22px;
    right:50%;

    transform:translateX(50%);

    width:32px;
    height:3px;

    border-radius:20px;

    background:#d5961b;
}


/* =========================================================
   PRODUCTS
========================================================= */

.products{
    width:1450px;
    max-width:calc(100% - 70px);

    margin:80px auto 60px;
}

.products-heading{
    display:flex;

    align-items:center;
    justify-content:space-between;

    padding-bottom:18px;

    border-bottom:2px solid #eee5da;
}

.products-heading h2{
    color:#563923;

    font-size:28px;

    font-weight:900;
}

.products-heading span{
    color:#9a8b7c;

    font-size:15px;

    font-weight:700;
}


/* =========================================================
   PRODUCT GRID
========================================================= */

.products-grid{
    margin-top:30px;

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(340px,380px));

    justify-content:flex-start;

    gap:30px;
}


/* =========================================================
   PRODUCT CARD - PREMIUM
========================================================= */

.product-card{
    position:relative;

    background:#fff;

    border:1px solid #eadfce;

    border-radius:22px;

    overflow:hidden;

    box-shadow:
        0 10px 30px rgba(55,39,24,.08);

    transition:
        transform .35s,
        box-shadow .35s,
        border-color .35s;

    animation:cardIn .5s ease both;

    cursor:pointer;
}

.product-card::before{
    content:"";

    position:absolute;

    top:0;
    right:0;
    left:0;

    height:4px;

    background:
        linear-gradient(
            90deg,
            #d58b0d,
            #f1b52d,
            #d58b0d
        );

    z-index:5;
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:translateY(20px) scale(.98);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}

.product-card:hover{
    transform:translateY(-10px);

    border-color:#e0bd77;

    box-shadow:
        0 25px 50px rgba(55,39,24,.16);
}


/* =========================================================
   PRODUCT IMAGE
========================================================= */

.product-img{
    width:100%;
    height:310px;

    position:relative;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 35%,
            #fff 0%,
            #f9f6f1 60%,
            #eee7dd 100%
        );
}

.product-img::after{
    content:"";

    position:absolute;

    left:20px;
    right:20px;
    bottom:14px;

    height:35px;

    border-radius:50%;

    background:rgba(91,64,34,.10);

    filter:blur(14px);

    z-index:0;
}

.product-img img{
    width:100%;
    height:100%;

    object-fit:contain;

    padding:18px;

    position:relative;
    z-index:1;

    transition:
        transform .5s,
        filter .5s;
}

.product-card:hover .product-img img{
    transform:scale(1.08) translateY(-4px);

    filter:drop-shadow(
        0 16px 18px rgba(58,39,20,.16)
    );
}

/* discount / new badge on image */

.product-badge{
    position:absolute;

    top:16px;
    right:16px;

    z-index:6;

    padding:6px 14px;

    border-radius:30px;

    font-size:12.5px;
    font-weight:800;

    color:#fff;

    background:
        linear-gradient(135deg,#e14b4b,#c92f2f);

    box-shadow:
        0 8px 16px rgba(201,47,47,.30);
}

/* quick-view overlay on the image, gold themed to match the site */

.product-quickview{
    position:absolute;

    inset:0;

    z-index:4;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            180deg,
            rgba(56,38,20,0) 40%,
            rgba(45,30,15,.42) 100%
        );

    opacity:0;

    transition:opacity .35s;
}

.product-card:hover .product-quickview{
    opacity:1;
}

.quickview-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    gap:8px;

    padding:11px 22px;

    border-radius:30px;

    background:#fff;

    color:#7a4e12;

    font-size:14px;
    font-weight:800;

    box-shadow:
        0 10px 22px rgba(0,0,0,.22);

    transform:translateY(14px);

    transition:
        transform .35s,
        background .3s,
        color .3s;
}

.product-card:hover .quickview-btn{
    transform:translateY(0);
}

.quickview-btn:hover{
    background:
        linear-gradient(135deg,#f0aa1e,#d88e0d);

    color:#fff;
}


/* =========================================================
   PRODUCT INFO
========================================================= */

.product-info{
    padding:23px 24px 21px;

    background:#fff;
}

.product-category-tag{
    display:inline-block;

    color:#a9760f;

    background:#fff3da;

    border:1px solid #f0d29a;

    padding:4px 13px;

    border-radius:30px;

    font-size:11.5px;

    font-weight:800;

    margin-bottom:10px;
}

.product-info h3{
    color:#30251d;

    font-size:20px;

    font-weight:900;

    line-height:1.6;

    margin-bottom:8px;

    transition:color .25s;
}

.product-card:hover .product-info h3{
    color:#b6790f;
}

.product-info p{
    color:#82766b;

    font-size:14px;

    font-weight:500;

    line-height:1.9;

    min-height:54px;

    max-height:54px;

    overflow:hidden;
}


/* =========================================================
   PRODUCT FOOTER
========================================================= */

.product-footer{
    margin-top:20px;

    padding-top:17px;

    border-top:1px solid #eee5da;

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:15px;
}

.price-box{
    display:flex;

    align-items:baseline;

    gap:10px;
}

.price{
    display:inline-flex;
    align-items:center;

    color:#805211;

    background:
        linear-gradient(
            135deg,
            #fff3d7,
            #f9e4b5
        );

    border:1px solid #f0d29a;

    padding:8px 15px;

    border-radius:11px;

    font-size:17px;

    font-weight:900;
}

.price-old{
    color:#b6aa9c;

    font-size:13.5px;

    font-weight:700;

    text-decoration:line-through;
}

.more{
    width:52px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #f0aa1e,
            #d88e0d
        );

    border-radius:13px;

    font-size:23px;

    font-weight:900;

    box-shadow:
        0 8px 18px rgba(216,142,13,.20);

    transition:.3s;
}

.more:hover{
    transform:translateX(-5px);

    box-shadow:
        0 12px 25px rgba(216,142,13,.30);
}


/* =========================================================
   EMPTY PRODUCTS
========================================================= */

.products-grid > p{
    width:100%;

    padding:60px 20px;

    color:#9c9084;

    font-size:17px !important;

    text-align:center;
}


/* =========================================================
   ALL PRODUCTS
========================================================= */

.all-products{
    display:flex;

    justify-content:center;

    margin-top:40px;
}

.all-products a{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    padding:13px 30px;

    border:1px solid #dfc9a8;

    border-radius:30px;

    color:#63472f;

    background:#fff;

    font-size:15px;

    font-weight:800;

    box-shadow:
        0 7px 18px rgba(70,45,20,.05);

    transition:.3s;
}

.all-products a:hover{
    background:#e5a01a;

    color:#fff;

    border-color:#e5a01a;

    transform:translateY(-3px);

    box-shadow:
        0 10px 25px rgba(229,160,26,.25);
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:1200px){

    .menu{
        gap:25px;
    }

    .menu a{
        font-size:13px;
    }

    .hero-content h1{
        font-size:40px;
    }

    .categories-row{
        gap:45px;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:750px){

    .navbar{
        height:70px;
    }

    .nav-inner{
        max-width:calc(100% - 25px);
    }

    .logo{
        width:62px;
        height:62px;
    }

    .logo img{
        width:55px;
        height:55px;
    }

    .menu{
        display:none;
    }

    .header-contact{
        padding:9px 18px;

        font-size:12px;
    }

    .hero{
        width:calc(100% - 25px);

        height:260px;

        margin-top:20px;

        border-radius:15px;
    }

    .hero-content{
        right:25px;
    }

    .hero-content h1{
        font-size:34px;
    }

    .hero-button{
        min-height:43px;

        font-size:13px;

        padding:0 17px;
    }

    .categories{
        margin-top:35px;
    }

    .categories-title{
        max-width:calc(100% - 25px);

        margin-bottom:25px;

        gap:12px;
    }

    .categories-title::before,
    .categories-title::after{
        width:35px;
    }

    .categories-title h2{
        font-size:23px;
    }

    .categories-row{
        max-width:calc(100% - 25px);

        gap:40px 15px;
    }

    .category{
        width:145px;
    }

    .category-badge{
        width:125px;
        height:175px;

        border-radius:65px;
    }

    .category-icon{
        width:92px;
        height:125px;

        border-radius:46px;
    }

    .category-name{
        font-size:14px;

        margin-top:12px;
    }

    .products{
        width:calc(100% - 25px);

        margin-top:65px;
    }

    .products-heading h2{
        font-size:22px;
    }

    .products-heading span{
        font-size:12px;
    }

    .products-grid{
        grid-template-columns:1fr;

        gap:22px;
    }

    .product-card{
        width:100%;
    }

    .product-img{
        height:300px;
    }

    .product-info h3{
        font-size:19px;
    }

    .product-info p{
        font-size:13px;
    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:480px){

    .hero{
        height:220px;
    }

    .hero-content h1{
        font-size:29px;
    }

    .categories-row{
        gap:30px 10px;
    }

    .category{
        width:135px;
    }

    .category-badge{
        width:115px;
        height:160px;
    }

    .category-icon{
        width:85px;
        height:115px;
    }

    .product-img{
        height:270px;
    }

}

</style>

<section class="hero">

<style></style>


<!-- =========================================================
     CATEGORIES
========================================================= -->

<section class="categories">

    <div class="categories-title">

        <h2>
            الأقسام
        </h2>

    </div>

    <div
        class="categories-row"
        id="categoriesRow"
    >
    </div>

</section>



<!-- =========================================================
     PRODUCTS
========================================================= -->

<section class="products" id="products">

    <div class="products-heading">

        <h2 id="productsTitle">
            &nbsp;
        </h2>

        <span id="productsCount"></span>

    </div>

    <div
        class="products-grid"
        id="productsGrid"
    ></div>

    <div class="all-products">

        <a href="store.html">
            عرض جميع المنتجات
            <span style="margin-right:8px;">←</span>
        </a>

    </div>

</section>



<script>

/* =========================================================
   DATA
========================================================= */

let categories = [];
let allProducts = [];
let activeCategoryId = null;

const categoriesRow =
    document.getElementById("categoriesRow");

const grid =
    document.getElementById("productsGrid");

const title =
    document.getElementById("productsTitle");

const count =
    document.getElementById("productsCount");


/* =========================================================
   IMAGE
========================================================= */

function resolveImage(path){

    if(!path) return "";

    if(/^https?:\/\//i.test(path)){
        return path;
    }

    return "/uploads/" +
        path.replace(/^\/?(uploads\/)?/,"");
}


/* =========================================================
   PRODUCT ID
========================================================= */

function getProductId(product){

    const id =
        product.id ??
        product._id ??
        product.ID ??
        product.productId ??
        product.product_id;

    return id !== undefined && id !== null
        ? String(id)
        : null;
}


/* =========================================================
   CATEGORY ID
========================================================= */

function getProductCategoryId(product){

    if(
        product.Category &&
        product.Category.id !== undefined
    ){
        return product.Category.id;
    }

    if(
        product.category &&
        typeof product.category === "object"
    ){
        return product.category.id;
    }

    return product.category;
}


/* =========================================================
   LOAD CATEGORIES
========================================================= */

async function loadCategories(){

    try{

        const res =
            await fetch("/api/categories");

        const data =
            await res.json();

        categories =
            Array.isArray(data)
                ? data
                : (
                    data.categories ||
                    data.data ||
                    []
                );

    }catch(err){

        console.error(
            "تعذر تحميل التصنيفات:",
            err
        );

        categories = [];
    }

    renderCategoryButtons();
}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

    try{

        const res =
            await fetch("/api/products");

        const data =
            await res.json();

        allProducts =
            Array.isArray(data)
                ? data
                : (
                    data.products ||
                    data.data ||
                    []
                );

    }catch(err){

        console.error(
            "تعذر تحميل المنتجات:",
            err
        );

        allProducts = [];
    }
}


/* =========================================================
   RENDER CATEGORIES
========================================================= */

function renderCategoryButtons(){

    if(!categoriesRow) return;

    categoriesRow.innerHTML = "";

    if(!categories.length){

        categoriesRow.innerHTML = `
            <p style="
                font-size:17px;
                color:#999;
                padding:40px;
            ">
                لا توجد تصنيفات حالياً
            </p>
        `;

        title.textContent = "";
        count.textContent = "";
        grid.innerHTML = "";

        return;
    }


    categories.forEach((cat,index)=>{

        const btn =
            document.createElement("button");

        btn.className =
            "category" +
            (
                index === 0
                    ? " active"
                    : ""
            );

        btn.dataset.category =
            cat.id;


        btn.innerHTML = `

            <div class="category-badge">

                <div class="category-icon">

                    ${
                        cat.image

                        ?

                        `
                        <img
                            src="${resolveImage(cat.image)}"
                            alt="${cat.name}"
                        >
                        `

                        :

                        `
                        <span
                            style="
                                font-size:42px;
                                color:#bd7b10;
                            "
                        >
                            ▤
                        </span>
                        `
                    }

                </div>

            </div>

            <div class="category-name">
                ${cat.name}
            </div>

        `;


        btn.addEventListener(
            "click",
            ()=>{

                document
                    .querySelectorAll(".category")
                    .forEach(b=>{
                        b.classList.remove("active");
                    });

                btn.classList.add("active");

                activeCategoryId =
                    cat.id;

                renderProducts(
                    cat.id,
                    cat.name
                );

                document
                    .getElementById("products")
                    .scrollIntoView({
                        behavior:"smooth",
                        block:"start"
                    });

            }
        );


        categoriesRow.appendChild(btn);

    });


    activeCategoryId =
        categories[0].id;

    renderProducts(
        categories[0].id,
        categories[0].name
    );

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(
    categoryId,
    categoryName
){

    const items =
        allProducts.filter(
            p =>
                String(
                    getProductCategoryId(p)
                )
                ===
                String(categoryId)
        );


    title.textContent =
        categoryName;

    count.textContent =
        `${items.length} منتجات`;


    grid.innerHTML = "";


    if(!items.length){

        grid.innerHTML = `

            <p>
                لا توجد منتجات في هذا التصنيف حالياً
            </p>

        `;

        return;
    }


    items.forEach(
        (item,index)=>{

            const id =
                getProductId(item);

            const detailsUrl =
                "product-details.html?id=" +
                encodeURIComponent(id || "");

            const card =
                document.createElement("div");

            card.className =
                "product-card";

            card.dataset.id =
                id || "";

            card.style.animationDelay =
                `${index * .08}s`;


            const priceText =
                item.price
                    ?
                    `${Number(
                        item.price
                    ).toLocaleString("en-US")} ج.م`
                    :
                    "";

            const oldPriceText =
                item.oldPrice
                    ?
                    `${Number(
                        item.oldPrice
                    ).toLocaleString("en-US")} ج.م`
                    :
                    "";


            card.innerHTML = `

                <div class="product-img">

                    ${
                        item.discount
                        ?
                        `<span class="product-badge">${item.discount}</span>`
                        :
                        ""
                    }

                    <img
                        src="${resolveImage(item.image)}"
                        alt="${item.title}"
                    >

                    <div class="product-quickview">
                        <span class="quickview-btn">
                            عرض تفاصيل المنتج
                        </span>
                    </div>

                </div>


                <div class="product-info">

                    <span class="product-category-tag">
                        ${categoryName}
                    </span>

                    <h3>
                        ${item.title}
                    </h3>

                    <p>
                        ${
                            item.description ||
                            "منتج مميز من رواد الظل"
                        }
                    </p>


                    <div class="product-footer">

                        <div class="price-box">

                            <span class="price">
                                ${priceText}
                            </span>

                            ${
                                oldPriceText
                                ?
                                `<span class="price-old">${oldPriceText}</span>`
                                :
                                ""
                            }

                        </div>


                        <a
                            href="${detailsUrl}"
                            class="more"
                            aria-label="عرض المنتج"
                        >
                            ←
                        </a>

                    </div>

                </div>

            `;


            // الضغط على أي جزء من الكارت (غير زرار "المزيد") يفتح صفحة التفاصيل
            card.addEventListener("click",(e)=>{

                if(e.target.closest(".more")) return;

                if(!id) return;

                window.location.href = detailsUrl;

            });


            grid.appendChild(card);

        }
    );

}


/* =========================================================
   INIT
========================================================= */

async function init(){

    await loadProducts();

    await loadCategories();

}

init();

</script>
