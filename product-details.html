    <style>
        .pd-page {
            font-family: 'Cairo', sans-serif;
            direction: rtl;
            padding: 140px 24px 100px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .pd-loading, .pd-not-found {
            text-align: center;
            padding: 100px 20px;
            color: #9aa1a8;
            font-size: 17px;
        }

        .pd-breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #9aa1a8;
            margin-bottom: 26px;
        }

        .pd-breadcrumb a {
            color: #9aa1a8;
            text-decoration: none;
        }

        .pd-breadcrumb a:hover { color: #b8860b; }

        .pd-wrap {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
        }

        @media (max-width: 820px) {
            .pd-wrap { grid-template-columns: 1fr; }
        }

        .pd-media {
            border-radius: 18px;
            overflow: hidden;
            background: #f4f4f4;
            height: 460px;
        }

        .pd-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pd-category {
            display: inline-block;
            background: #fff6e6;
            color: #b8860b;
            font-size: 13px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 50px;
            margin-bottom: 16px;
        }

        .pd-title {
            font-size: 30px;
            font-weight: 800;
            color: #1a1a1a;
            margin: 0 0 16px;
            line-height: 1.5;
        }

        .pd-price-row {
            display: flex;
            align-items: baseline;
            gap: 14px;
            margin-bottom: 8px;
        }

        .pd-price-now {
            font-size: 28px;
            font-weight: 800;
            color: #1a1a1a;
        }

        .pd-price-old {
            font-size: 16px;
            color: #aaa;
            text-decoration: line-through;
        }

        .pd-discount-badge {
            display: inline-block;
            background: #d64545;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 50px;
            margin-bottom: 20px;
        }

        .pd-description {
            color: #555;
            font-size: 15px;
            line-height: 1.9;
            margin-bottom: 28px;
        }

        .pd-qty-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .pd-qty-row label {
            font-weight: 700;
            font-size: 14px;
            color: #333;
        }

        .pd-qty-control {
            display: flex;
            align-items: center;
            border: 1px solid #e2e2e2;
            border-radius: 50px;
            overflow: hidden;
        }

        .pd-qty-control button {
            width: 38px;
            height: 38px;
            border: none;
            background: #f7f7f7;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            color: #333;
        }

        .pd-qty-control input {
            width: 46px;
            text-align: center;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 15px;
            outline: none;
        }

        .pd-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pd-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .pd-btn:hover { opacity: 0.9; }

        .pd-btn-cart {
            background: #1a1a1a;
            color: #fff;
        }

        .pd-btn-whatsapp-contact {
            background: #25D366;
            color: #fff;
        }

        .pd-btn-whatsapp-order {
            background: #128C7E;
            color: #fff;
        }

        .pd-added-msg {
            display: none;
            background: #eafff0;
            color: #16a34a;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
        }
    </style>
</head>
